<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TimeGuessr Leaderboard</title>
<style>
/* ============================================================
   DESIGN TOKENS
   Palette: deep-ocean night base, aviation-instrument accents.
   ============================================================ */
:root{
  --abyss:#050a12;          /* page base            */
  --deep:#0a1424;           /* panel base           */
  --hull:#0f1c30;           /* raised surface       */
  --hull-hi:#16273f;        /* hover / header       */
  --rule:rgba(126,168,216,.16);
  --rule-str:rgba(126,168,216,.32);
  --ink:#e9f2ff;
  --ink-mid:#a8bfdc;
  --ink-dim:#6a839f;
  --gold:#ffcf4a;
  --good:#3ee08a;
  --bad:#ff5f6d;

  --font-display:"Bahnschrift","DIN Alternate","DIN Condensed","Roboto Condensed",
                 "Barlow Condensed","Archivo Narrow","Helvetica Neue Condensed",
                 "Arial Narrow",system-ui,sans-serif;
  --font-body:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-hud:ui-monospace,"SF Mono","JetBrains Mono","Roboto Mono",Menlo,Consolas,monospace;

  --gap:14px;
  --radius:14px;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 700px at 78% -12%,rgba(0,132,180,.20),transparent 60%),
    radial-gradient(900px 620px at 8% 108%,rgba(93,40,160,.20),transparent 62%),
    var(--abyss);
  color:var(--ink);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* ---------- Masthead ---------- */
.masthead{
  display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;
  padding:20px clamp(14px,2.4vw,30px) 12px;
  border-bottom:1px solid var(--rule);
  background:linear-gradient(180deg,rgba(11,26,46,.94),rgba(5,10,18,0));
}
.brandmark{display:flex;align-items:center;gap:12px}
.brandmark svg{width:38px;height:38px;flex:none}
.brandtext h1{
  font-family:var(--font-display);font-stretch:condensed;
  font-size:clamp(25px,3.3vw,38px);line-height:.92;margin:0;
  letter-spacing:.028em;text-transform:uppercase;font-weight:700;
}
.brandtext h1 em{font-style:normal;color:#37c8ef}
.brandtext .sub{
  font-family:var(--font-hud);font-size:10.5px;letter-spacing:.26em;
  color:var(--ink-dim);text-transform:uppercase;margin-top:5px;
}
.masthead .spacer{flex:1 1 auto}
.stamp{
  font-family:var(--font-hud);font-size:11px;color:var(--ink-mid);
  text-align:right;line-height:1.65;letter-spacing:.06em;
}
.stamp b{color:var(--ink);font-weight:600}
.livedot{
  display:inline-block;width:7px;height:7px;border-radius:50%;
  background:var(--good);margin-right:6px;vertical-align:middle;
  box-shadow:0 0 0 0 rgba(62,224,138,.7);animation:pulse 2.4s infinite;
}
@keyframes pulse{
  70%{box-shadow:0 0 0 9px rgba(62,224,138,0)}
  100%{box-shadow:0 0 0 0 rgba(62,224,138,0)}
}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- Buttons ---------- */
button{font:inherit;color:inherit}
.btn{
  font-family:var(--font-display);font-stretch:condensed;text-transform:uppercase;
  letter-spacing:.09em;font-size:12.5px;font-weight:600;
  background:var(--hull);border:1px solid var(--rule-str);color:var(--ink-mid);
  padding:8px 14px;border-radius:8px;cursor:pointer;
  transition:background .16s,color .16s,border-color .16s,transform .06s;
}
.btn:hover{background:var(--hull-hi);color:var(--ink);border-color:rgba(126,168,216,.5)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:#0f7fa8;border-color:#28a8d4;color:#eafaff}
.btn.primary:hover{background:#1595c2}
.btn.sm{padding:5px 10px;font-size:11px}
:focus-visible{outline:2px solid #45cdf0;outline-offset:2px;border-radius:6px}

/* ---------- Bento grid ---------- */
.board{
  display:grid;grid-template-columns:repeat(12,1fr);
  gap:var(--gap);padding:var(--gap) clamp(14px,2.4vw,30px) 60px;
  align-items:start;
}
.panel{
  grid-column:span var(--span,6);
  background:linear-gradient(180deg,rgba(20,38,62,.72),rgba(9,18,32,.9));
  border:1px solid var(--rule);border-radius:var(--radius);
  overflow:hidden;position:relative;
  box-shadow:0 10px 34px rgba(0,0,0,.42);
  opacity:0;transform:translateY(14px);
  animation:panelIn .5s cubic-bezier(.2,.75,.3,1) forwards;
}
@keyframes panelIn{to{opacity:1;transform:none}}
.phead{
  display:flex;align-items:center;gap:9px;
  padding:10px 12px;background:rgba(11,26,46,.72);
  border-bottom:1px solid var(--rule);
}
.ptitle{
  font-family:var(--font-display);font-stretch:condensed;text-transform:uppercase;
  letter-spacing:.12em;font-size:13px;font-weight:700;color:var(--ink);
}
.pnote{font-family:var(--font-hud);font-size:10px;color:var(--ink-dim);letter-spacing:.1em}
.phead .spacer{flex:1}
.iconbtn{
  background:transparent;border:1px solid transparent;border-radius:6px;
  width:24px;height:24px;display:grid;place-items:center;cursor:pointer;
  color:var(--ink-dim);font-family:var(--font-hud);font-size:11px;
}
.iconbtn:hover{background:var(--hull-hi);color:var(--ink);border-color:var(--rule)}
.pbody{padding:13px}

/* ---------- Help tooltips ---------- */
.help{position:relative;display:inline-flex;vertical-align:middle}
.help > .q{
  width:15px;height:15px;border-radius:50%;border:1px solid var(--rule-str);
  background:var(--hull);color:var(--ink-dim);font-family:var(--font-hud);
  font-size:9.5px;display:grid;place-items:center;cursor:help;padding:0;
}
.help > .q:hover{color:var(--ink);border-color:#45cdf0}
.help .tip{
  position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%) translateY(4px);
  width:250px;background:#0c1a2c;border:1px solid var(--rule-str);border-radius:9px;
  padding:9px 11px;font-family:var(--font-body);font-size:11.5px;line-height:1.5;
  color:var(--ink-mid);opacity:0;pointer-events:none;transition:.16s;z-index:60;
  box-shadow:0 12px 30px rgba(0,0,0,.6);text-transform:none;letter-spacing:0;font-weight:400;
}
.help .tip b{color:var(--ink)}
.help .tip code{font-family:var(--font-hud);font-size:10.5px;color:#7ee0ff}
.help:hover .tip,.help > .q:focus-visible + .tip{opacity:1;transform:translateX(-50%)}

/* ---------- Tables ---------- */
table{width:100%;border-collapse:collapse}
th,td{text-align:right;padding:7px 6px;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{
  font-family:var(--font-display);font-stretch:condensed;text-transform:uppercase;
  letter-spacing:.1em;font-size:10.5px;color:var(--ink-dim);font-weight:600;
  border-bottom:1px solid var(--rule-str);padding-bottom:8px;
}
tbody tr{border-bottom:1px solid rgba(126,168,216,.09)}
tbody tr:last-child{border-bottom:0}
tbody td{font-size:13px;color:var(--ink-mid)}
td.big{
  font-family:var(--font-display);font-stretch:condensed;font-weight:700;
  font-size:19px;color:var(--ink);letter-spacing:.01em;
}
.who{display:flex;align-items:center;gap:8px}
.chip{width:9px;height:9px;border-radius:2px;flex:none;box-shadow:0 0 9px currentColor}
.who .nm{
  font-family:var(--font-display);font-stretch:condensed;font-weight:700;
  font-size:15px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink);
}
.pos{
  font-family:var(--font-display);font-stretch:condensed;font-weight:700;font-size:15px;
  color:var(--ink-dim);width:20px;display:inline-block;
}
.sub{font-family:var(--font-hud);font-size:9.5px;color:var(--ink-dim);letter-spacing:.06em}
.trend{font-family:var(--font-hud);font-size:11px}
.up{color:var(--good)} .down{color:var(--bad)} .flat{color:var(--ink-dim)}

/* ---------- Departures board (split-flap) ---------- */
.board-strip{
  display:grid;grid-template-columns:26px 1fr auto 74px;gap:9px;align-items:center;
  background:#070d17;border:1px solid rgba(126,168,216,.14);border-radius:9px;
  padding:9px 11px;margin-bottom:7px;position:relative;overflow:hidden;
}
.board-strip::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.045) 0 1px,transparent 1px 4px);
}
.board-strip .lane{
  font-family:var(--font-display);font-stretch:condensed;font-weight:700;
  font-size:16px;color:var(--ink-dim);
}
.flap{display:flex;gap:2px}
.flap span{
  display:inline-grid;place-items:center;min-width:15px;height:26px;padding:0 1px;
  background:linear-gradient(180deg,#182a44 0 48%,#0e1c30 52% 100%);
  border-radius:3px;font-family:var(--font-display);font-stretch:condensed;
  font-weight:700;font-size:18px;color:#fff;
  box-shadow:inset 0 -1px 0 rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.07);
  position:relative;
}
.flap span::after{
  content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.55);
}
.flap.name span{min-width:13px;font-size:15px;color:var(--ink)}
.flap.sc span{font-size:19px}
.status{
  font-family:var(--font-hud);font-size:9.5px;letter-spacing:.11em;text-align:right;
}
.st-win{color:var(--gold)} .st-in{color:var(--ink-dim)} .st-wait{color:#ff9f43}

/* ---------- Ocean race ---------- */
.ocean-wrap{position:relative;border-radius:10px;overflow:hidden;background:#040a14}
.ocean-wrap svg{display:block;width:100%;height:auto}
.hud-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:8px;margin-top:10px}
.hud{
  border:1px solid var(--rule);border-radius:9px;padding:8px 10px;
  background:linear-gradient(180deg,rgba(16,32,54,.8),rgba(8,16,28,.8));
  position:relative;overflow:hidden;
}
.hud::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2.5px;background:currentColor}
.hud .cs{
  font-family:var(--font-display);font-stretch:condensed;font-weight:700;font-size:13px;
  text-transform:uppercase;letter-spacing:.09em;display:flex;align-items:center;gap:6px;
}
.hud dl{display:grid;grid-template-columns:auto 1fr;gap:1px 8px;margin:6px 0 0;
  font-family:var(--font-hud);font-size:10px;color:var(--ink-dim);letter-spacing:.07em}
.hud dd{margin:0;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.hud dt{white-space:nowrap}

/* ---------- Podium (composed SVG scene) ---------- */
.podium-scene{position:relative;margin:2px 0 4px}
.podium-scene svg{display:block;width:100%;height:auto;overflow:visible}
/* Entrance animation lives on an inner <g> that has no transform attribute.
   Only opacity is animated, so it can never clobber the positioning transform
   on the parent group. */
.pilot-enter{animation:pilotIn .55s ease-out both}
@keyframes pilotIn{from{opacity:0}to{opacity:1}}
.streakbar{
  display:flex;gap:8px;flex-wrap:wrap;margin-top:11px;padding-top:10px;
  border-top:1px solid var(--rule);
}
.streakbar .s{
  font-family:var(--font-hud);font-size:10px;color:var(--ink-dim);letter-spacing:.06em;
  border:1px solid var(--rule);border-radius:20px;padding:3px 9px;
}
.streakbar .s b{color:var(--ink);font-weight:600}

/* ---------- Alert banner (fetch problems) ---------- */
.alertbar{display:none}
.alertbar.show{
  display:flex;align-items:flex-start;gap:10px;
  padding:11px clamp(14px,2.4vw,30px);
  font-size:12.5px;line-height:1.55;border-bottom:1px solid;
}
.alertbar.err{background:rgba(255,95,109,.1);border-color:rgba(255,95,109,.45);color:#ffc0c6}
.alertbar.warn{background:rgba(255,159,67,.1);border-color:rgba(255,159,67,.4);color:#ffd7a8}
.alertbar .ico{
  flex:none;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;
  background:currentColor;color:#0a1424;font-weight:700;font-size:11px;
  font-family:var(--font-hud);margin-top:1px;
}
.alertbar .txt{flex:1}
.alertbar .txt b{
  display:block;font-family:var(--font-display);font-stretch:condensed;
  text-transform:uppercase;letter-spacing:.09em;font-size:12.5px;margin-bottom:2px;
}
.alertbar .alert-x{
  flex:none;background:transparent;border:1px solid currentColor;border-radius:6px;
  width:22px;height:22px;cursor:pointer;color:inherit;opacity:.7;font-size:11px;
  display:grid;place-items:center;
}
.alertbar .alert-x:hover{opacity:1}

/* ---------- Period selector bar ---------- */
.periodbar{
  display:flex;align-items:center;gap:11px;flex-wrap:wrap;
  padding:9px clamp(14px,2.4vw,30px);
  border-bottom:1px solid var(--rule);background:rgba(8,17,30,.6);
}
.periodbar .plabel{
  font-family:var(--font-display);font-stretch:condensed;font-weight:700;font-size:11px;
  text-transform:uppercase;letter-spacing:.15em;color:var(--ink-dim);
}
.pchips{display:flex;gap:6px;flex-wrap:wrap}
.pchip{
  font-family:var(--font-display);font-stretch:condensed;font-weight:600;font-size:12px;
  text-transform:uppercase;letter-spacing:.08em;
  background:var(--hull);border:1px solid var(--rule-str);color:var(--ink-mid);
  padding:6px 12px;border-radius:20px;cursor:pointer;display:flex;align-items:center;gap:6px;
  transition:background .15s,color .15s,border-color .15s;
}
.pchip:hover{background:var(--hull-hi);color:var(--ink)}
.pchip.on{background:#0f7fa8;border-color:#37c8ef;color:#eafaff}
.livetag{
  font-family:var(--font-hud);font-size:8px;letter-spacing:.12em;
  background:var(--good);color:#04220f;border-radius:3px;padding:1.5px 4px;font-weight:700;
}
.livetag.sm{margin-left:6px;transform:scale(.9)}
.phint{
  font-family:var(--font-hud);font-size:9.5px;color:var(--ink-dim);letter-spacing:.05em;
  margin-left:auto;max-width:340px;line-height:1.5;
}
.scopetag{
  font-family:var(--font-hud);font-size:9px;letter-spacing:.11em;color:#7ee0ff;
  border:1px solid rgba(69,205,240,.4);border-radius:4px;padding:1.5px 6px;margin-left:7px;
}

/* ---------- Monthly panels ---------- */
.mname{
  font-family:var(--font-display);font-stretch:condensed;font-weight:700;font-size:14px;
  text-transform:uppercase;letter-spacing:.05em;color:var(--ink);
}
.champs{display:grid;gap:9px}
.champrow{
  display:grid;grid-template-columns:34px 1fr auto;gap:11px;align-items:center;
  border:1px solid var(--rule);border-radius:10px;padding:9px 11px;
  background:linear-gradient(90deg,rgba(255,255,255,.035),transparent 60%);
  position:relative;overflow:hidden;
}
.champrow::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:currentColor}
.cbadge{
  width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:17px;
  background:rgba(255,255,255,.05);border:1px solid currentColor;
}
.cname{
  font-family:var(--font-display);font-stretch:condensed;font-weight:700;font-size:14.5px;
  text-transform:uppercase;letter-spacing:.06em;color:var(--ink);
}
.cbar{height:5px;border-radius:3px;background:rgba(126,168,216,.14);margin:5px 0 5px;overflow:hidden}
.cbar span{
  display:block;height:100%;border-radius:3px;background:currentColor;
  box-shadow:0 0 10px currentColor;transition:width .8s cubic-bezier(.2,.8,.3,1);
}
.pips{display:flex;gap:3px;flex-wrap:wrap}
.pip{
  width:9px;height:9px;border-radius:50%;
  background:rgba(126,168,216,.18);border:1px solid var(--rule-str);
}
.pip.on{border-color:transparent;box-shadow:0 0 7px currentColor}
.ccount{
  font-family:var(--font-display);font-stretch:condensed;font-weight:700;font-size:30px;
  line-height:1;color:currentColor;text-shadow:0 0 14px currentColor;min-width:26px;text-align:right;
}
.livebox{
  margin-top:11px;padding:10px 12px;border:1px solid var(--rule-str);border-radius:10px;
  background:rgba(69,205,240,.05);
}
.lbhead{
  font-family:var(--font-display);font-stretch:condensed;font-weight:700;font-size:12px;
  text-transform:uppercase;letter-spacing:.1em;color:var(--ink-mid);
  display:flex;align-items:center;gap:8px;
}
.lbmain{
  font-family:var(--font-display);font-stretch:condensed;font-weight:700;font-size:17px;
  margin-top:5px;color:var(--ink);
}
.lbsub{font-family:var(--font-body);font-size:11.5px;font-weight:400;color:var(--ink-dim)}

/* ---------- Live data source ---------- */
.srcrow{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.srcrow input[type=text]{flex:1 1 210px;min-width:0}
.srcstat{
  font-family:var(--font-hud);font-size:9.5px;color:var(--ink-dim);letter-spacing:.05em;
  margin-top:6px;line-height:1.55;
}
.srcstat b{color:var(--ink)}
.srcstat .dot{
  display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;
  vertical-align:middle;background:var(--ink-dim);
}
.srcstat .dot.on{background:var(--good)}
.srcstat .dot.err{background:var(--bad)}

/* ---------- Forms ---------- */
textarea,input[type=text]{
  width:100%;background:#060d18;border:1px solid var(--rule-str);border-radius:9px;
  color:var(--ink);font-family:var(--font-hud);font-size:11px;line-height:1.55;padding:9px 10px;
  resize:vertical;
}
textarea{min-height:132px;white-space:pre;overflow-x:auto}
textarea:focus,input:focus{border-color:#45cdf0;outline:none}
.field-lbl{
  font-family:var(--font-display);font-stretch:condensed;text-transform:uppercase;
  letter-spacing:.11em;font-size:11px;color:var(--ink-dim);font-weight:600;
  display:block;margin:0 0 6px;
}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px;align-items:center}
.msg{
  margin-top:10px;border-radius:9px;padding:9px 11px;font-size:12px;line-height:1.55;
  border:1px solid;display:none;
}
.msg.show{display:block}
.msg.ok{background:rgba(62,224,138,.08);border-color:rgba(62,224,138,.4);color:#a8f2cd}
.msg.err{background:rgba(255,95,109,.08);border-color:rgba(255,95,109,.45);color:#ffc0c6}
.msg.warn{background:rgba(255,159,67,.08);border-color:rgba(255,159,67,.4);color:#ffd7a8}
.msg b{display:block;margin-bottom:3px;font-family:var(--font-display);font-stretch:condensed;
  text-transform:uppercase;letter-spacing:.09em;font-size:12px}
.msg ul{margin:5px 0 0;padding-left:17px}
.filedrop{
  border:1px dashed var(--rule-str);border-radius:9px;padding:13px;text-align:center;
  color:var(--ink-dim);font-size:12px;cursor:pointer;transition:.16s;display:block;
}
.filedrop:hover,.filedrop.over{border-color:#45cdf0;color:var(--ink);background:rgba(69,205,240,.05)}

/* ---------- Crew editor ---------- */
.crew{display:grid;gap:9px}
.crewrow{
  display:grid;grid-template-columns:30px 1fr 34px;gap:9px;align-items:center;
  border:1px solid var(--rule);border-radius:9px;padding:8px 10px;background:rgba(10,20,36,.6);
}
.crewrow input[type=color]{
  width:34px;height:30px;padding:0;border:1px solid var(--rule-str);border-radius:7px;
  background:transparent;cursor:pointer;
}
.crewrow .avatar{
  width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:15px;
  background:rgba(255,255,255,.05);border:1px solid currentColor;
}

/* ---------- Charts ---------- */
.chart-wrap{position:relative}
.chart-wrap svg{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;gap:13px;flex-wrap:wrap;margin-bottom:9px}
.legend .li{
  display:flex;align-items:center;gap:6px;font-family:var(--font-display);
  font-stretch:condensed;font-weight:600;font-size:12px;text-transform:uppercase;
  letter-spacing:.07em;color:var(--ink-mid);cursor:pointer;user-select:none;
}
.legend .li.off{opacity:.34}
.legend .sw{width:15px;height:3px;border-radius:2px}
.tipbox{
  position:absolute;pointer-events:none;background:#0c1a2c;border:1px solid var(--rule-str);
  border-radius:9px;padding:8px 10px;font-family:var(--font-hud);font-size:10.5px;
  color:var(--ink-mid);opacity:0;transition:opacity .12s;z-index:40;white-space:nowrap;
  box-shadow:0 12px 30px rgba(0,0,0,.6);
}
.tipbox .d{color:var(--ink);font-size:11px;margin-bottom:4px;letter-spacing:.07em}
.tipbox .r{display:flex;justify-content:space-between;gap:13px}
.tipbox .r b{color:#fff;font-weight:600}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:8px;margin-bottom:11px}

<script>
"use strict";
/* ============================================================================
   1. PLAYER CONFIG  —  EDIT ME
   ----------------------------------------------------------------------------
   `key` must match the row label used in the spreadsheet (case-insensitive).
   Everything else is yours to change: display name, accent colour, callsign
   (shown on the HUD), and badge (any emoji or 1-2 characters).
   The in-page "Crew" panel edits name + colour + badge live; this object is
   the source of truth on load.
   ========================================================================== */
var PLAYER_CONFIG = [
  { key:"Ewan", name:"Ewan", color:"#00e5ff", callsign:"ECHO-1", badge:"\u2708\uFE0F" },
  { key:"Dan",  name:"Dan",  color:"#ffb800", callsign:"DELTA-2", badge:"\uD83D\uDEE9\uFE0F" },
  { key:"Dad",  name:"Dad",  color:"#ff4d8d", callsign:"PAPA-3",  badge:"\uD83D\uDEE0\uFE0F" }
];
var MAX_DAILY = 50000;   /* 5 rounds x 10,000 */
var MAX_ROUND = 10000;
var BIG_DAY   = 40000;   /* threshold for the ">40K days" stat (see parser notes) */

/* ============================================================================
   2. CSV PARSING
   ========================================================================== */

/* RFC4180-ish row splitter: handles "43,370" quoted thousands and "" escapes. */
function splitCSV(text){
  var rows=[], row=[], field="", q=false, i=0, c, n;
  text = String(text).replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  for(i=0;i<text.length;i++){
    c=text[i];
    if(q){
      if(c==='"'){ n=text[i+1]; if(n==='"'){field+='"';i++;} else q=false; }
      else field+=c;
    } else if(c==='"'){ q=true; }
    else if(c===','){ row.push(field); field=""; }
    else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=""; }
    else field+=c;
  }
  row.push(field); rows.push(row);
  while(rows.length && rows[rows.length-1].every(function(x){return x.trim()==="";})) rows.pop();
  return rows;
}

var cell    = function(r,i){ return (r && r[i]!=null) ? String(r[i]).trim() : ""; };
var norm    = function(s){ return String(s||"").trim().toLowerCase().replace(/\s+/g," "); };
var rowText = function(r){ return (r||[]).map(norm).join("|"); };

/* "43,370" -> 43370 ; "" -> null ; "12.39%" -> 12.39 */
function toNum(v){
  if(v==null) return null;
  var s=String(v).replace(/[,\s\u00a0]/g,"").replace(/%$/,"");
  if(s==="") return null;
  var n=Number(s);
  return isFinite(n)?n:null;
}

/* DD/MM/YYYY (also tolerates D/M/YY and DD-MM-YYYY) */
function parseDate(s){
  var m=/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/.exec(String(s).trim());
  if(!m) return null;
  var d=+m[1], mo=+m[2], y=+m[3];
  if(y<100) y+=2000;
  if(d<1||d>31||mo<1||mo>12) return null;
  return { d:d, m:mo, y:y, iso:y+"-"+String(mo).padStart(2,"0")+"-"+String(d).padStart(2,"0") };
}
var MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var fmtDate     = function(dt){ return dt.d+" "+MONTHS[dt.m-1]; };
var fmtDateLong = function(dt){ return dt.d+" "+MONTHS[dt.m-1]+" "+dt.y; };

/* ----------------------------------------------------------------------------
   parseSheet(text)
   Recognises the five stacked blocks by marker cells rather than assuming a
   rectangular CSV, and tolerates growth: new date columns append to the right
   of Blocks A/C/D, new rows append to the bottom of Block E.
   Returns { dates, daily, reported, crosscheck, warnings } or throws ParseError.
   -------------------------------------------------------------------------- */
function ParseError(msg,hint){ this.name="ParseError"; this.message=msg; this.hint=hint||""; }
ParseError.prototype=Object.create(Error.prototype);


/* Secondary layout: the tidy "Date, PlayerA, PlayerB, ... , Winner" orientation
   produced by this dashboard's own Download button, so an exported master copy
   can be loaded straight back in. */
function parseTall(rows){
  for(var i=0;i<rows.length;i++){
    var dateCol=-1, labels=[], j;
    for(j=0;j<rows[i].length;j++) if(norm(cell(rows[i],j))==="date"){ dateCol=j; break; }
    if(dateCol<0) continue;
    for(j=0;j<rows[i].length;j++){
      var h=cell(rows[i],j);
      if(j!==dateCol && h && norm(h)!=="winner") labels.push({name:h,col:j});
    }
    if(!labels.length) continue;
    var dates=[], daily={};
    labels.forEach(function(l){ daily[l.name]=[]; });
    for(var k=i+1;k<rows.length;k++){
      var dt=parseDate(cell(rows[k],dateCol));
      if(!dt){
        if(rowText(rows[k]).replace(/\|/g,"")==="") continue;
        break;
      }
      dates.push(dt);
      labels.forEach(function(l){ daily[l.name].push(toNum(cell(rows[k],l.col))); });
    }
    if(dates.length>=1) return { dates:dates, order:labels.map(function(l){return l.name;}), daily:daily };
  }
  return null;
}

function parseSheet(text){
  if(!String(text||"").trim())
    throw new ParseError("Nothing to read.","Paste the sheet export, or choose a .csv file.");

  var rows=splitCSV(text), warnings=[], i, j, r;

  /* ---- Block A: date header = first row with >=1 parseable date and a blank A1 */
  var hdrIdx=-1, dateCols=[];
  for(i=0;i<rows.length;i++){
    var found=[];
    for(j=1;j<rows[i].length;j++){
      var dt=parseDate(cell(rows[i],j));
      if(dt) found.push({col:j,date:dt});
    }
    if(found.length>=2 && cell(rows[i],0)===""){ hdrIdx=i; dateCols=found; break; }
  }
  if(hdrIdx<0){
    var tall=parseTall(rows);
    if(tall) return {
      dates:tall.dates, order:tall.order, daily:tall.daily,
      reported:{}, crosscheck:{winners:null,cum:{},roll:{},blockE:[]}, warnings:warnings
    };
    throw new ParseError(
      "No date header row found.",
      "Expected either the spreadsheet layout (a row of DD/MM/YYYY columns with a player row under each), "+
      "or a tidy export with a \u201cDate\u201d column and one column per player."
    );
  }

  /* ---- Player rows: labelled rows under the header, until blank/'Winner' */
  var daily={}, order=[];
  for(i=hdrIdx+1;i<rows.length;i++){
    r=rows[i];
    var label=cell(r,0);
    if(label==="") { if(rowText(r).replace(/\|/g,"")==="") break; else continue; }
    if(norm(label)==="winner") break;
    var vals=dateCols.map(function(dc){ return toNum(cell(r,dc.col)); });
    if(!vals.some(function(v){return v!=null;})) break;
    daily[label]=vals; order.push(label);
  }
  if(!order.length)
    throw new ParseError(
      "Found the dates but no player score rows.",
      "Each player needs a row directly under the date header: name, then one score per day."
    );

  /* ---- 'Winner' row (cross-check only; we always recompute) */
  var reportedWinners=null;
  for(i=hdrIdx+1;i<Math.min(rows.length,hdrIdx+12);i++){
    if(norm(cell(rows[i],0))==="winner"){
      reportedWinners=dateCols.map(function(dc){ return cell(rows[i],dc.col); });
      break;
    }
  }

  /* ---- Block B: stats table, located by its header cells -------------------
     NOTE: in the source sheet the four extremum columns are mislabelled — the
     pair headed "Highest/Lowest Score" actually holds single-ROUND scores
     (<= 10,000) and the pair headed "Highest/Lowest Round" holds DAY totals.
     Rather than trust either label we classify by magnitude.               */
  var reported={};
  for(i=0;i<rows.length;i++){
    var t=rowText(rows[i]);
    if(t.indexOf("total score")>-1 && t.indexOf("average score")>-1){
      var col={};
      for(j=0;j<rows[i].length;j++){
        var h=norm(cell(rows[i],j));
        if(!h) continue;
        if(h==="highest score")      col.hiA=j;
        else if(h==="lowest score")  col.loA=j;
        else if(h==="highest round") col.hiB=j;
        else if(h==="lowest round")  col.loB=j;
        else if(h==="total score")   col.total=j;
        else if(h==="average score") col.avg=j;
        else if(h.indexOf("days")>-1 && h.indexOf(">")>-1) col.big=j;
        else if(h.indexOf("swing")>-1) col.swing=j;
      }
      for(var k=i+1;k<rows.length;k++){
        var nm=cell(rows[k],0);
        if(nm===""){ if(rowText(rows[k]).replace(/\|/g,"")==="") break; else continue; }
        if(!daily.hasOwnProperty(nm)) break;
        var A=[toNum(cell(rows[k],col.hiA)), toNum(cell(rows[k],col.loA))];
        var B=[toNum(cell(rows[k],col.hiB)), toNum(cell(rows[k],col.loB))];
        /* whichever pair fits inside one round (<=10,000) is the round pair */
        var aIsRound = A[0]!=null && A[0]<=MAX_ROUND;
        var rp = aIsRound?A:B, dp = aIsRound?B:A;
        reported[nm]={
          roundHigh:rp[0], roundLow:rp[1], dayHigh:dp[0], dayLow:dp[1],
          total:toNum(cell(rows[k],col.total)), avg:toNum(cell(rows[k],col.avg)),
          bigDays:toNum(cell(rows[k],col.big)), swing:toNum(cell(rows[k],col.swing)),
          labelsSwapped:aIsRound
        };
      }
      break;
    }
  }

  /* ---- Block C ("The lab" / "Score Race"): cumulative, cross-check only */
  var cumRep={};
  for(i=0;i<rows.length;i++){
    var tc=rowText(rows[i]);
    if(tc.indexOf("score race")>-1 || norm(cell(rows[i],0))==="the lab"){
      for(var c2=i+1;c2<rows.length;c2++){
        var n2=cell(rows[c2],0);
        if(n2===""){ if(rowText(rows[c2]).replace(/\|/g,"")==="") break; else continue; }
        if(!daily.hasOwnProperty(n2)) break;
        cumRep[n2]=dateCols.map(function(dc){ return toNum(cell(rows[c2],dc.col)); });
      }
      break;
    }
  }

  /* ---- Block D ("Rolling 7 day average"): cross-check only */
  var rollRep={};
  for(i=0;i<rows.length;i++){
    if(rowText(rows[i]).indexOf("rolling 7 day average")>-1){
      for(var d2=i+1;d2<rows.length;d2++){
        var n3=cell(rows[d2],0);
        if(n3===""){ if(rowText(rows[d2]).replace(/\|/g,"")==="") break; else continue; }
        if(!daily.hasOwnProperty(n3)) break;
        rollRep[n3]=dateCols.map(function(dc){ return toNum(cell(rows[d2],dc.col)); });
      }
      break;
    }
  }

  /* ---- Block E: transposed restatement. In the source sheet this holds
     CUMULATIVE totals (not daily scores), so it is used only as a soft
     cross-check and never as an input. Grows downward. */
  var blockE=[];
  for(i=0;i<rows.length;i++){
    var hits=0, map={};
    for(j=1;j<rows[i].length;j++){
      var v=cell(rows[i],j);
      if(daily.hasOwnProperty(v)){ map[v]=j; hits++; }
    }
    if(hits>=order.length && i>hdrIdx){
      for(var e=i+1;e<rows.length;e++){
        var dt2=null, dcol=-1;
        for(j=0;j<Math.min(rows[e].length,3);j++){
          var pd=parseDate(cell(rows[e],j));
          if(pd){ dt2=pd; dcol=j; break; }
        }
        if(!dt2) { if(rowText(rows[e]).replace(/\|/g,"")==="") continue; else break; }
        var rec={date:dt2, vals:{}};
        order.forEach(function(nm2){ rec.vals[nm2]=toNum(cell(rows[e],map[nm2])); });
        blockE.push(rec);
      }
      break;
    }
  }

  return {
    dates:dateCols.map(function(dc){return dc.date;}),
    order:order, daily:daily,
    reported:reported,
    crosscheck:{winners:reportedWinners, cum:cumRep, roll:rollRep, blockE:blockE},
    warnings:warnings
  };
}

/* ============================================================================
   3. DERIVED STATS  —  everything is recomputed from Block A daily scores.
   ========================================================================== */
function mean(a){ return a.length ? a.reduce(function(x,y){return x+y;},0)/a.length : null; }

/* Sample standard deviation (Excel STDEV.S) — matches the sheet's Swing %. */
function stdevSample(a){
  if(a.length<2) return null;
  var m=mean(a);
  return Math.sqrt(a.reduce(function(s,v){return s+(v-m)*(v-m);},0)/(a.length-1));
}

function buildModel(parsed){
  /* Trim trailing date columns that nobody has played yet, so every chart ends
     at the true edge of the data. They reappear the moment a score lands. */
  var full=parsed.dates.length, lastData=-1;
  for(var z=full-1;z>=0;z--){
    if(parsed.order.some(function(k){ return parsed.daily[k][z]!=null; })){ lastData=z; break; }
  }
  if(lastData<0)
    throw new ParseError("Found the layout, but no scores in it.",
      "Every day column is empty \u2014 add at least one player's score and load again.");
  var trimmed=full-1-lastData;

  var dates=parsed.dates.slice(0,lastData+1), N=dates.length, players=[];

  parsed.order.forEach(function(key){
    var scores=parsed.daily[key].slice(0,N), played=scores.filter(function(v){return v!=null;});

    /* cumulative: running total, carried forward across unplayed days */
    var cum=[], run=0, anyYet=false;
    for(var i=0;i<N;i++){
      if(scores[i]!=null){ run+=scores[i]; anyYet=true; }
      cum.push(anyYet?run:null);
    }

    /* rolling 7: mean of the days actually played inside a trailing 7-date
       window; only emitted once a full 7-column window exists. */
    var roll=[];
    for(i=0;i<N;i++){
      if(i<6){ roll.push(null); continue; }
      var w=scores.slice(i-6,i+1).filter(function(v){return v!=null;});
      roll.push(w.length?Math.round(mean(w)):null);
    }

    var hi=null,lo=null,hiAt=null,loAt=null;
    for(i=0;i<N;i++){
      var v=scores[i]; if(v==null) continue;
      if(hi==null||v>hi){hi=v;hiAt=dates[i];}
      if(lo==null||v<lo){lo=v;loAt=dates[i];}
    }

    var total=played.reduce(function(x,y){return x+y;},0);
    var sd=stdevSample(played), av=mean(played);
    /* current rolling value is anchored on the latest contested day */
    var lastRoll=roll[N-1], prevRoll=(N-8>=0)?roll[N-8]:null;

    var cfg=PLAYER_CONFIG.filter(function(c){return c.key.toLowerCase()===key.toLowerCase();})[0];
    players.push({
      key:key,
      name:cfg?cfg.name:key,
      color:cfg?cfg.color:"#8fb7ff",
      callsign:cfg?cfg.callsign:key.toUpperCase(),
      badge:cfg?cfg.badge:"\u2708\uFE0F",
      scores:scores, cum:cum, roll:roll,
      played:played.length, total:total,
      avg:av==null?null:Math.round(av),
      dayHigh:hi, dayHighAt:hiAt, dayLow:lo, dayLowAt:loAt,
      bigDays:played.filter(function(v){return v>BIG_DAY;}).length,
      swing:(sd!=null&&av)?(sd/av*100):null,
      rollNow:lastRoll, rollPrev:prevRoll,
      lastScore:(function(){ for(var z=N-1;z>=0;z--) if(scores[z]!=null) return scores[z]; return null; })(),
      wins:0, streak:0,
      roundHigh:(parsed.reported[key]||{}).roundHigh,
      roundLow:(parsed.reported[key]||{}).roundLow
    });
  });

  /* daily winners (ties share the win) */
  var winners=[];
  for(var i=0;i<N;i++){
    var best=null;
    players.forEach(function(p){ if(p.scores[i]!=null && (best==null||p.scores[i]>best)) best=p.scores[i]; });
    if(best==null){ winners.push([]); continue; }
    var w=players.filter(function(p){return p.scores[i]===best;}).map(function(p){return p.key;});
    w.forEach(function(k){ players.filter(function(p){return p.key===k;})[0].wins++; });
    winners.push(w);
  }
  /* current win streak, counting back over days that were actually contested */
  players.forEach(function(p){
    var s=0;
    for(var i=N-1;i>=0;i--){
      if(!winners[i].length) continue;
      if(winners[i].indexOf(p.key)>-1) s++; else break;
    }
    p.streak=s;
    /* longest run of consecutive wins across contested days */
    var best=0, run=0;
    for(i=0;i<N;i++){
      if(!winners[i].length) continue;
      if(winners[i].indexOf(p.key)>-1){ run++; if(run>best) best=run; }
      else run=0;
    }
    p.longest=best;
  });

  /* cross-checks against the sheet's own precomputed blocks */
  var checks=[];
  function check(label,ok){ checks.push({label:label,ok:ok}); }
  players.forEach(function(p){
    var rep=parsed.reported[p.key];
    if(rep){
      if(rep.total!=null) check(p.name+" total "+fmtInt(rep.total), rep.total===p.total);
      if(rep.avg!=null)   check(p.name+" average", Math.abs(rep.avg-p.avg)<=1);
      if(rep.bigDays!=null) check(p.name+" 40K days", rep.bigDays===p.bigDays);
      if(rep.swing!=null && p.swing!=null) check(p.name+" swing %", Math.abs(rep.swing-p.swing)<0.02);
    }
    var rc=parsed.crosscheck.cum[p.key];
    if(rc) check(p.name+" score race",
      rc.every(function(v,i){ return i>=N || v==null || v===p.cum[i]; }));
    var rr=parsed.crosscheck.roll[p.key];
    if(rr) check(p.name+" rolling 7",
      rr.every(function(v,i){ return i>=N || v==null || (p.roll[i]!=null && Math.abs(v-p.roll[i])<=1); }));
  });
  if(parsed.crosscheck.winners){
    var wOK=parsed.crosscheck.winners.every(function(w,i){
      if(!w || i>=N) return true;
      return winners[i].length===0 || winners[i].indexOf(w)>-1;
    });
    check("Winner row", wOK);
  }

  return {
    dates:dates, players:players, winners:winners, latest:N-1, trimmed:trimmed,
    checks:checks,
    labelsSwapped:Object.keys(parsed.reported).some(function(k){return parsed.reported[k].labelsSwapped;}),
    hasRounds:players.some(function(p){return p.roundHigh!=null;})
  };
}

function fmtInt(n){
  if(n==null||!isFinite(n)) return "\u2014";
  return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,",");
}

/* ============================================================================
   3b. MONTHLY COMPETITION
   The overall contest runs on every day ever logged; the monthly race restarts
   from zero on the 1st of each calendar month. Both are derived from the same
   daily scores, so nothing needs re-entering.
   ========================================================================== */
function monthKey(d){ return d.y+"-"+String(d.m).padStart(2,"0"); }
function monthLabel(k){ var p=String(k).split("-"); return MONTHS[+p[1]-1]+" "+p[0]; }
function monthShort(k){ var p=String(k).split("-"); return MONTHS[+p[1]-1].toUpperCase(); }

/* Calendar months present in the data, in the order they appear. */
function listMonths(model){
  var out=[];
  model.dates.forEach(function(d){
    var k=monthKey(d);
    if(out.indexOf(k)<0) out.push(k);
  });
  return out;
}

/* ----------------------------------------------------------------------------
   scopeModel(model, period)
   period is "all" or a month key such as "2026-08".
   Returns an object shaped like the full model, but with cumulative totals
   restarted at the start of the window (that is the point of a monthly race)
   and every stat recomputed inside it. Rolling-7 values are carried over from
   the full timeline rather than recomputed, so form does not reset at a month
   boundary and there is no dead 6-day gap at the start of each month.
   -------------------------------------------------------------------------- */
function scopeModel(model,period){
  var idx=[];
  model.dates.forEach(function(d,i){
    if(period==="all"||monthKey(d)===period) idx.push(i);
  });
  if(!idx.length) idx=model.dates.map(function(_,i){ return i; });

  var dates=idx.map(function(i){ return model.dates[i]; });
  var winners=idx.map(function(i){ return model.winners[i]; });

  var players=model.players.map(function(p){
    var scores=idx.map(function(i){ return p.scores[i]; });
    var roll=idx.map(function(i){ return p.roll[i]; });
    var played=scores.filter(function(v){ return v!=null; });

    var cum=[], run=0, any=false;
    scores.forEach(function(v){
      if(v!=null){ run+=v; any=true; }
      cum.push(any?run:null);
    });

    var hi=null,lo=null,hiAt=null,loAt=null;
    scores.forEach(function(v,j){
      if(v==null) return;
      if(hi==null||v>hi){ hi=v; hiAt=dates[j]; }
      if(lo==null||v<lo){ lo=v; loAt=dates[j]; }
    });

    var total=played.reduce(function(a,b){ return a+b; },0);
    var av=played.length?total/played.length:null;
    var sd=stdevSample(played);

    var wins=0;
    winners.forEach(function(w){ if(w.indexOf(p.key)>-1) wins++; });

    var st=0;
    for(var z=winners.length-1;z>=0;z--){
      if(!winners[z].length) continue;
      if(winners[z].indexOf(p.key)>-1) st++; else break;
    }
    var best=0, run2=0;
    winners.forEach(function(w){
      if(!w.length) return;
      if(w.indexOf(p.key)>-1){ run2++; if(run2>best) best=run2; } else run2=0;
    });

    var lastRoll=null, prevRoll=null;
    if(roll.length){ lastRoll=roll[roll.length-1]; prevRoll=roll.length>=8?roll[roll.length-8]:null; }

    var out={};
    Object.keys(p).forEach(function(k){ out[k]=p[k]; });
    out.scores=scores; out.cum=cum; out.roll=roll;
    out.played=played.length; out.total=total;
    out.avg=av==null?null:Math.round(av);
    out.dayHigh=hi; out.dayHighAt=hiAt; out.dayLow=lo; out.dayLowAt=loAt;
    out.bigDays=played.filter(function(v){ return v>BIG_DAY; }).length;
    out.swing=(sd!=null&&av)?(sd/av*100):null;
    out.rollNow=lastRoll; out.rollPrev=prevRoll;
    out.lastScore=(function(){ for(var z=scores.length-1;z>=0;z--) if(scores[z]!=null) return scores[z]; return null; })();
    out.wins=wins; out.streak=st; out.longest=best;
    /* single-round highs/lows only exist as all-time figures in the sheet */
    out.roundHigh=(period==="all")?p.roundHigh:null;
    out.roundLow =(period==="all")?p.roundLow :null;
    return out;
  });

  return {
    dates:dates, players:players, winners:winners, latest:dates.length-1,
    period:period, scoped:(period!=="all"),
    label:(period==="all")?"All time":monthLabel(period),
    hasRounds:(period==="all")&&model.hasRounds
  };
}

/* ----------------------------------------------------------------------------
   monthlySummary(model)
   One entry per calendar month, with each player's monthly total and the
   month's winner. The most recent month is flagged in-progress: it is shown as
   "leading" and is NOT counted toward months-won until a later month begins.
   -------------------------------------------------------------------------- */
function monthlySummary(model){
  var keys=listMonths(model);
  return keys.map(function(k,i){
    var v=scopeModel(model,k);
    var rows=v.players.map(function(p){
      return { key:p.key, name:p.name, color:p.color, total:p.total,
               played:p.played, wins:p.wins, avg:p.avg };
    });
    var top=0;
    rows.forEach(function(r){ if(r.total>top) top=r.total; });
    var champs=top>0?rows.filter(function(r){ return r.total===top; }).map(function(r){ return r.key; }):[];
    /* days actually contested, not date columns present */
    var played=0;
    v.winners.forEach(function(w){ if(w.length) played++; });
    return {
      key:k, label:monthLabel(k), short:monthShort(k),
      days:played, rows:rows, champs:champs,
      inProgress:(i===keys.length-1)
    };
  });
}

/* Completed months won per player key. */
function monthsWonMap(months){
  var out={};
  months.forEach(function(mo){
    if(mo.inProgress) return;
    mo.champs.forEach(function(k){ out[k]=(out[k]||0)+1; });
  });
  return out;
}

/* ============================================================================
   4. APP STATE + STORAGE
   ========================================================================== */
var STATE={ model:null, view:null, rawCSV:"", order:null, spans:{}, hidden:{},
            sortBy:"total", period:"all", timer:null };
var MEM={};
/* Persistence, in order of preference:
     1. window.storage  - present when running as a Claude artifact
     2. localStorage    - works when the file is hosted (GitHub Pages etc.);
                          wrapped in try/catch because it throws in the sandbox
     3. in-memory       - always available, lost on refresh
   This is what lets the layout, chosen period and sheet URL survive a reload
   once the dashboard is hosted. */
var Store={
  get:function(k){
    try{
      if(window.storage&&window.storage.get)
        return window.storage.get(k).then(function(r){ return r?JSON.parse(r.value):null; })
                                    .catch(function(){ return Store.local(k); });
    }catch(e){}
    return Promise.resolve(Store.local(k));
  },
  local:function(k){
    try{
      var v=window.localStorage.getItem(k);
      if(v!=null) return JSON.parse(v);
    }catch(e){}
    return MEM[k]!==undefined?MEM[k]:null;
  },
  set:function(k,v){
    MEM[k]=v;
    try{ window.localStorage.setItem(k,JSON.stringify(v)); }catch(e){}
    try{ if(window.storage&&window.storage.set) return window.storage.set(k,JSON.stringify(v)).catch(function(){}); }catch(e){}
    return Promise.resolve();
  }
};
var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion:reduce)").matches;
var $  = function(s,r){ return (r||document).querySelector(s); };
var esc = function(s){ return String(s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); };
/* Players from the period-scoped view, minus any hidden by the legend.
   This MUST read the scoped view: charts pair these values against the scoped
   date axis, so sourcing them from the full model pairs (say) August dates with
   the very first July scores. */
var visible = function(){ return VIEW().players.filter(function(p){ return !STATE.hidden[p.key]; }); };

/* The period-scoped view of the data (all time, or one calendar month). Panels
   that show a race/standings read this; Today, the monthly panels and Crew read
   the full model instead. */
var VIEW = function(){
  if(!STATE.view) STATE.view=scopeModel(STATE.model,STATE.period||"all");
  return STATE.view;
};
/* Small badge telling you which period a scoped panel is showing. */
function scopeNote(v){
  return '<div class="pnote" style="margin-bottom:9px">'+
    (v.scoped?'MONTHLY RACE':'OVERALL')+
    '<span class="scopetag">'+esc(v.label.toUpperCase())+'</span></div>';
}

/* ============================================================================
   5. CHART PRIMITIVES  (hand-rolled SVG — no external chart library)
   ========================================================================== */
function niceTicks(min,max,count){
  var span=(max-min)||1, step=Math.pow(10,Math.floor(Math.log10(span/count)));
  var err=span/count/step;
  if(err>=7.5) step*=10; else if(err>=3.5) step*=5; else if(err>=1.5) step*=2;
  var t=[], v=Math.ceil(min/step)*step;
  for(;v<=max+step*0.001;v+=step) t.push(Math.round(v));
  return t;
}

/* Draws a multi-series line/area chart with gap-aware paths and a hover readout. */
function lineChart(host,opts){
  var dates=opts.dates, series=opts.series.filter(function(s){ return s.values.some(function(v){return v!=null;}); });
  if(!series.length){ host.innerHTML='<div class="empty">No scores to plot yet.</div>'; return; }

  var W=760, H=opts.height||250, L=52, R=14, T=14, B=30;
  var iw=W-L-R, ih=H-T-B, n=dates.length;
  var all=[]; series.forEach(function(s){ s.values.forEach(function(v){ if(v!=null) all.push(v); }); });
  var mn=Math.min.apply(null,all), mx=Math.max.apply(null,all), pad=(mx-mn)*0.14||500;
  var y0=Math.max(0,mn-pad), y1=mx+pad;
  var X=function(i){ return L + (n<2?iw/2:iw*i/(n-1)); };
  var Y=function(v){ return T + ih - ih*(v-y0)/(y1-y0); };
  var ticks=niceTicks(y0,y1,4);
  var step=Math.max(1,Math.ceil(n/9));
  var uid="c"+Math.random().toString(36).slice(2,8);
  var s=['<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="'+esc(opts.aria||"Score chart")+'">'];

  s.push('<defs>');
  series.forEach(function(sr,k){
    s.push('<linearGradient id="'+uid+'g'+k+'" x1="0" y1="0" x2="0" y2="1">',
      '<stop offset="0" stop-color="'+sr.color+'" stop-opacity=".26"/>',
      '<stop offset="1" stop-color="'+sr.color+'" stop-opacity="0"/></linearGradient>');
  });
  s.push('</defs>');

  ticks.forEach(function(t){
    s.push('<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(t).toFixed(1)+'" y2="'+Y(t).toFixed(1)+
      '" stroke="rgba(126,168,216,.13)"/>',
      '<text x="'+(L-9)+'" y="'+(Y(t)+3.5).toFixed(1)+'" text-anchor="end" fill="#6a839f" '+
      'font-size="10" font-family="ui-monospace,monospace">'+fmtInt(t)+'</text>');
  });
  for(var i=0;i<n;i+=step)
    s.push('<text x="'+X(i).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle" fill="#6a839f" '+
      'font-size="10" font-family="ui-monospace,monospace">'+fmtDate(dates[i])+'</text>');

  series.forEach(function(sr,k){
    var segs=[], cur=[];
    sr.values.forEach(function(v,i){
      if(v==null){ if(cur.length)segs.push(cur); cur=[]; }
      else cur.push([X(i),Y(v)]);
    });
    if(cur.length) segs.push(cur);
    segs.forEach(function(seg){
      if(opts.area&&seg.length>1){
        var a="M"+seg[0][0].toFixed(1)+" "+(T+ih);
        seg.forEach(function(p){ a+="L"+p[0].toFixed(1)+" "+p[1].toFixed(1); });
        a+="L"+seg[seg.length-1][0].toFixed(1)+" "+(T+ih)+"Z";
        s.push('<path d="'+a+'" fill="url(#'+uid+'g'+k+')"/>');
      }
      var d=seg.map(function(p,j){ return (j?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1); }).join("");
      if(seg.length===1)
        s.push('<circle cx="'+seg[0][0].toFixed(1)+'" cy="'+seg[0][1].toFixed(1)+'" r="3" fill="'+sr.color+'"/>');
      else
        s.push('<path d="'+d+'" fill="none" stroke="'+sr.color+'" stroke-width="2.2" '+
          'stroke-linejoin="round" stroke-linecap="round" style="filter:drop-shadow(0 0 5px '+sr.color+'66)"/>');
    });
    var last=-1; sr.values.forEach(function(v,i){ if(v!=null) last=i; });
    if(last>-1) s.push('<circle cx="'+X(last).toFixed(1)+'" cy="'+Y(sr.values[last]).toFixed(1)+
      '" r="3.6" fill="'+sr.color+'" stroke="#050a12" stroke-width="1.6"/>');
  });

  s.push('<line class="cross" x1="0" x2="0" y1="'+T+'" y2="'+(T+ih)+
    '" stroke="rgba(126,168,216,.5)" stroke-dasharray="3 3" style="opacity:0"/>');
  s.push('<rect x="'+L+'" y="'+T+'" width="'+iw+'" height="'+ih+'" fill="transparent" class="hit"/>');
  s.push('</svg>');
  host.innerHTML=s.join("")+'<div class="tipbox"></div>';

  /* hover readout */
  var svg=$("svg",host), tip=$(".tipbox",host), cross=$(".cross",host), hit=$(".hit",host);
  function move(ev){
    var r=svg.getBoundingClientRect();
    var px=((ev.touches?ev.touches[0].clientX:ev.clientX)-r.left)/r.width*W;
    var i=Math.round((px-L)/(iw||1)*(n-1));
    i=Math.max(0,Math.min(n-1,i));
    cross.setAttribute("x1",X(i)); cross.setAttribute("x2",X(i)); cross.style.opacity=1;
    var rows=series.map(function(sr){
      return '<div class="r"><span style="color:'+sr.color+'">'+esc(sr.name)+'</span><b>'+
        (sr.values[i]==null?"\u2014":fmtInt(sr.values[i]))+'</b></div>';
    }).join("");
    tip.innerHTML='<div class="d">'+fmtDateLong(dates[i])+'</div>'+rows;
    tip.style.opacity=1;
    var hostW=host.clientWidth, tx=X(i)/W*hostW+12;
    if(tx>hostW-140) tx=X(i)/W*hostW-tip.offsetWidth-12;
    tip.style.left=Math.max(0,tx)+"px";
    tip.style.top="6px";
  }
  function out(){ tip.style.opacity=0; cross.style.opacity=0; }
  hit.addEventListener("mousemove",move);
  hit.addEventListener("mouseleave",out);
  hit.addEventListener("touchmove",function(e){ move(e); },{passive:true});
  hit.addEventListener("touchend",out);
}

function legendHTML(){
  return '<div class="legend">'+STATE.model.players.map(function(p){
    return '<div class="li'+(STATE.hidden[p.key]?" off":"")+'" data-k="'+esc(p.key)+'" role="button" tabindex="0">'+
      '<span class="sw" style="background:'+p.color+'"></span>'+esc(p.name)+'</div>';
  }).join("")+'</div>';
}
function wireLegend(root,rerender){
  Array.prototype.forEach.call(root.querySelectorAll(".legend .li"),function(li){
    function t(){
      var k=li.getAttribute("data-k");
      var on=STATE.model.players.filter(function(p){return !STATE.hidden[p.key];});
      if(!STATE.hidden[k]&&on.length<=1) return;      /* keep at least one series */
      STATE.hidden[k]=!STATE.hidden[k]; rerender();
    }
    li.addEventListener("click",t);
    li.addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); t(); } });
  });
}

/* ============================================================================
   5b. GROUPED BAR CHART  (monthly totals, one bar per player per month)
   ========================================================================== */
function groupedBarChart(host,opts){
  var groups=opts.groups||[], series=(opts.series||[]).filter(function(s){
    return s.values.some(function(v){ return v!=null; });
  });
  if(!groups.length||!series.length){
    host.innerHTML='<div class="empty">No months to compare yet.</div>';
    return;
  }
  var W=760, H=opts.height||236, L=56, R=14, T=18, B=42;
  var iw=W-L-R, ih=H-T-B;
  var all=[];
  series.forEach(function(s){ s.values.forEach(function(v){ if(v!=null) all.push(v); }); });
  var mx=Math.max.apply(null,all), y1=mx*1.14||1000;
  var Y=function(v){ return T+ih-ih*v/y1; };
  var gw=iw/groups.length;                        /* width per month  */
  var bw=Math.min(34,(gw*0.68)/series.length);    /* width per bar    */
  var pad=(gw-bw*series.length)/2;
  var ticks=niceTicks(0,y1,4);
  var uid="b"+Math.random().toString(36).slice(2,8);
  var s=['<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opts.aria||"Monthly totals")+'">'];

  s.push('<defs>');
  series.forEach(function(sr,k){
    s.push('<linearGradient id="'+uid+k+'" x1="0" y1="0" x2="0" y2="1">',
      '<stop offset="0" stop-color="'+sr.color+'" stop-opacity=".95"/>',
      '<stop offset="1" stop-color="'+sr.color+'" stop-opacity=".38"/></linearGradient>');
  });
  s.push('</defs>');

  ticks.forEach(function(t){
    s.push('<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(t).toFixed(1)+'" y2="'+Y(t).toFixed(1)+
      '" stroke="rgba(126,168,216,.13)"/>',
      '<text x="'+(L-9)+'" y="'+(Y(t)+3.5).toFixed(1)+'" text-anchor="end" fill="#6a839f" '+
      'font-size="10" font-family="ui-monospace,monospace">'+fmtInt(t)+'</text>');
  });

  var showVals=(groups.length*series.length)<=15;
  groups.forEach(function(g,gi){
    var gx=L+gi*gw;
    /* alternating month band for readability */
    if(gi%2===1)
      s.push('<rect x="'+gx.toFixed(1)+'" y="'+T+'" width="'+gw.toFixed(1)+'" height="'+ih+
        '" fill="rgba(126,168,216,.035)"/>');
    series.forEach(function(sr,si){
      var v=sr.values[gi];
      if(v==null||v<=0) return;
      var x=gx+pad+si*bw, h=Math.max(1,(T+ih)-Y(v));
      s.push('<rect x="'+x.toFixed(1)+'" y="'+Y(v).toFixed(1)+'" width="'+(bw-3).toFixed(1)+
        '" height="'+h.toFixed(1)+'" rx="2.5" fill="url(#'+uid+si+')" '+
        'style="filter:drop-shadow(0 0 6px '+sr.color+'55)">'+
        '<title>'+esc(sr.name)+' \u2014 '+esc(g.label||g)+': '+fmtInt(v)+'</title></rect>');
      if(showVals)
        s.push('<text x="'+(x+(bw-3)/2).toFixed(1)+'" y="'+(Y(v)-5).toFixed(1)+
          '" text-anchor="middle" fill="'+sr.color+'" font-size="9.5" font-weight="700" '+
          'style="font-family:var(--font-display)">'+fmtInt(v)+'</text>');
    });
    /* month label + optional champion marker */
    s.push('<text x="'+(gx+gw/2).toFixed(1)+'" y="'+(H-24)+'" text-anchor="middle" fill="#a8bfdc" '+
      'font-size="11" font-weight="700" letter-spacing="1" style="font-family:var(--font-display)">'+
      esc(g.label||g)+'</text>');
    if(g.sub)
      s.push('<text x="'+(gx+gw/2).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle" fill="#6a839f" '+
        'font-size="9" letter-spacing=".6" font-family="ui-monospace,monospace">'+esc(g.sub)+'</text>');
  });

  s.push('</svg>');
  host.innerHTML=s.join("");
}

/* ============================================================================
   6. PANEL: OCEAN RACE
   Distance flown along each arc maps directly to cumulative score.
   ========================================================================== */
function findAtX(path,x,total){
  var lo=0, hi=total, mid, p;
  for(var i=0;i<24;i++){
    mid=(lo+hi)/2; p=path.getPointAtLength(mid);
    if(p.x<x) lo=mid; else hi=mid;
  }
  return { len:mid, pt:path.getPointAtLength(mid) };
}

function renderOcean(body){
  var m=VIEW(), ps=m.players;
  var maxCum=Math.max.apply(null,ps.map(function(p){ return p.cum[m.latest]||0; }));
  var axisMax=Math.max(1000,Math.ceil(maxCum/100000)*100000);
  if(axisMax-maxCum<axisMax*0.06) axisMax+=100000;
  var W=1000,H=340,X0=78,X1=928;
  var X=function(v){ return X0+(X1-X0)*v/axisMax; };
  var top=100, bot=252, n=ps.length;
  var lanes=ps.map(function(p,i){ return n<2 ? (top+bot)/2 : top+i*((bot-top)/(n-1)); });

  var s=['<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Cumulative score race">'];
  s.push('<defs>',
    '<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">',
      '<stop offset="0" stop-color="#071a30"/><stop offset=".55" stop-color="#04121f"/>',
      '<stop offset="1" stop-color="#020a12"/></linearGradient>',
    '<radialGradient id="dawn" cx="94%" cy="16%" r="52%">',
      '<stop offset="0" stop-color="#1d7fa8" stop-opacity=".55"/>',
      '<stop offset="1" stop-color="#1d7fa8" stop-opacity="0"/></radialGradient>',
    '</defs>');
  s.push('<rect width="'+W+'" height="'+H+'" fill="url(#sea)"/>',
         '<rect width="'+W+'" height="'+H+'" fill="url(#dawn)"/>');

  /* clouds */
  [[150,52,54,13,.05],[330,38,74,15,.04],[700,60,62,12,.045],[520,300,86,14,.03],[860,250,58,11,.035]]
    .forEach(function(c){
      s.push('<ellipse cx="'+c[0]+'" cy="'+c[1]+'" rx="'+c[2]+'" ry="'+c[3]+'" fill="#bcd9f2" opacity="'+c[4]+'"/>');
    });
  /* swell */
  for(var w=0;w<3;w++){
    var yy=298+w*13, d="M0 "+yy;
    for(var x=0;x<=W;x+=44) d+=" q22 "+(w%2?-6:6)+" 44 0";
    s.push('<path d="'+d+'" fill="none" stroke="rgba(126,168,216,'+(0.11-w*0.03)+')" stroke-width="1.4"/>');
  }

  /* distance meridians, labelled in score */
  var ticks=niceTicks(0,axisMax,5);
  ticks.forEach(function(t){
    if(t<=0) return;
    s.push('<line x1="'+X(t).toFixed(1)+'" x2="'+X(t).toFixed(1)+'" y1="34" y2="292" '+
      'stroke="rgba(126,168,216,.12)" stroke-dasharray="2 7"/>');
    s.push('<text x="'+X(t).toFixed(1)+'" y="26" text-anchor="middle" fill="#6a839f" font-size="10" '+
      'font-family="ui-monospace,monospace" letter-spacing="1">'+(t/1000)+'K</text>');
  });

  /* origin + landfall */
  s.push('<line x1="'+X0+'" x2="'+X0+'" y1="34" y2="292" stroke="rgba(126,168,216,.34)"/>',
    '<text x="'+X0+'" y="26" text-anchor="middle" fill="#8fa5c4" font-size="10" '+
    'font-family="ui-monospace,monospace" letter-spacing="1">DEPART</text>');
  s.push('<line x1="'+X1+'" x2="'+X1+'" y1="34" y2="292" stroke="rgba(255,207,74,.4)" stroke-dasharray="5 4"/>',
    '<text x="'+X1+'" y="26" text-anchor="middle" fill="#ffcf4a" font-size="10" '+
    'font-family="ui-monospace,monospace" letter-spacing="1">HORIZON</text>');

  /* compass rose */
  s.push('<g transform="translate(946,300)" opacity=".5">',
    '<circle r="26" fill="none" stroke="rgba(126,168,216,.3)"/>',
    '<circle r="18" fill="none" stroke="rgba(126,168,216,.16)"/>',
    '<path d="M0 -24 L5 0 L0 24 L-5 0Z" fill="rgba(126,168,216,.28)"/>',
    '<path d="M0 -24 L5 0 L-5 0Z" fill="#37c8ef"/>',
    '<path d="M-24 0 L0 4 L24 0 L0 -4Z" fill="rgba(126,168,216,.18)"/>',
    '<text x="0" y="-30" text-anchor="middle" fill="#8fa5c4" font-size="9" '+
    'font-family="ui-monospace,monospace">N</text></g>');

  /* one arc + plane per player */
  ps.forEach(function(p,i){
    var by=lanes[i];
    var d="M"+X0+" "+by+" Q"+((X0+X1)/2)+" "+(by-52)+" "+X1+" "+(by-18);
    s.push('<path id="route'+i+'" d="'+d+'" fill="none" stroke="rgba(126,168,216,.17)" stroke-dasharray="1 8" stroke-linecap="round"/>');
    s.push('<path id="trail'+i+'" d="'+d+'" fill="none" stroke="'+p.color+'" stroke-width="2.4" '+
      'stroke-dasharray="0 99999" stroke-linecap="round" opacity=".9" '+
      'style="filter:drop-shadow(0 0 6px '+p.color+'aa)"/>');
    s.push('<g id="plane'+i+'" style="filter:drop-shadow(0 0 7px '+p.color+'cc)">',
      '<path d="M17 0 L-4 -7 L-2 -1.6 L-13 -3.4 L-13 3.4 L-2 1.6 L-4 7 Z" fill="'+p.color+'" '+
      'stroke="#04101c" stroke-width=".8" stroke-linejoin="round"/></g>');
    s.push('<g id="tag'+i+'"><text x="0" y="0" fill="'+p.color+'" font-size="12" '+
      'font-weight="700" letter-spacing="1" text-anchor="middle" '+
      'style="font-family:var(--font-display);text-transform:uppercase">'+esc(p.name)+'</text></g>');
  });
  s.push('</svg>');

  var leader=ps.slice().sort(function(a,b){ return (b.cum[m.latest]||0)-(a.cum[m.latest]||0); })[0];
  var hud=ps.map(function(p){
    var c=p.cum[m.latest]||0, gap=(leader.cum[m.latest]||0)-c;
    return '<div class="hud" style="color:'+p.color+'">'+
      '<div class="cs">'+p.badge+' '+esc(p.name)+'</div>'+
      '<dl><dt>TOTAL</dt><dd class="num">'+fmtInt(c)+'</dd>'+
      '<dt>LAST</dt><dd class="num">'+fmtInt(p.lastScore)+'</dd>'+
      '<dt>7-DAY FORM</dt><dd class="num">'+fmtInt(p.rollNow)+'</dd>'+
      '<dt>GAP</dt><dd class="num">'+(gap?"-"+fmtInt(gap):"LEADER")+'</dd></dl></div>';
  }).join("");

  body.innerHTML=scopeNote(m)+'<div class="ocean-wrap">'+s.join("")+'</div>'+
    '<div class="hud-row">'+hud+'</div>';

  /* fly the planes out to their cumulative distance */
  var svg=$("svg",body);
  ps.forEach(function(p,i){
    var route=svg.querySelector("#route"+i), trail=svg.querySelector("#trail"+i);
    var plane=svg.querySelector("#plane"+i), tag=svg.querySelector("#tag"+i);
    var total=route.getTotalLength(), target=p.cum[m.latest]||0;
    function place(v){
      var hitX=X(v), r=findAtX(route,hitX,total);
      var a=route.getPointAtLength(Math.max(0,r.len-7)), b=route.getPointAtLength(Math.min(total,r.len+7));
      var ang=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;
      trail.setAttribute("stroke-dasharray",r.len.toFixed(1)+" "+(total+10));
      plane.setAttribute("transform","translate("+r.pt.x.toFixed(1)+","+r.pt.y.toFixed(1)+") rotate("+ang.toFixed(1)+")");
      tag.setAttribute("transform","translate("+r.pt.x.toFixed(1)+","+(r.pt.y-17).toFixed(1)+")");
    }
    if(reduceMotion){ place(target); return; }
    var t0=null, dur=1500;
    requestAnimationFrame(function step(ts){
      if(t0===null) t0=ts;
      var k=Math.min(1,(ts-t0)/dur), e=1-Math.pow(1-k,3);
      place(target*e);
      if(k<1) requestAnimationFrame(step);
    });
  });
}

/* ============================================================================
   7. PANEL: TODAY'S LEADERBOARD  (departures board)
   ========================================================================== */
var FLAPSET="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 ,-";
function flapInto(node,text,order){
  var chars=String(text).split("");
  node.innerHTML=chars.map(function(){ return "<span>&nbsp;</span>"; }).join("");
  var spans=node.querySelectorAll("span");
  chars.forEach(function(ch,i){
    var sp=spans[i];
    if(reduceMotion||ch===" "){ sp.innerHTML = ch===" "?"&nbsp;":esc(ch); return; }
    var ticks=4+i*2+order*3, t=0;
    var iv=setInterval(function(){
      t++;
      if(t>=ticks){ sp.textContent=ch; clearInterval(iv); }
      else sp.textContent=FLAPSET[Math.floor(Math.random()*FLAPSET.length)];
    },42);
  });
}

function renderToday(body){
  var m=STATE.model, i=m.latest;
  var rows=m.players.map(function(p){ return {p:p, v:p.scores[i]}; })
    .sort(function(a,b){
      if(a.v==null&&b.v==null) return 0;
      if(a.v==null) return 1; if(b.v==null) return -1;
      return b.v-a.v;
    });
  var win=m.winners[i]||[];
  var html='<div class="pnote" style="margin-bottom:9px">DEPARTURES \u00B7 '+
    esc(fmtDateLong(m.dates[i]))+'</div>';
  rows.forEach(function(r,k){
    var st = r.v==null ? '<span class="st-wait">AWAITING</span>'
           : (win.indexOf(r.p.key)>-1 ? '<span class="st-win">\u2605 DAY WIN</span>'
                                      : '<span class="st-in">LANDED</span>');
    html+='<div class="board-strip">'+
      '<div class="lane" style="color:'+r.p.color+'">'+(r.v==null?"\u2013":(k+1))+'</div>'+
      '<div class="flap name" data-t="'+esc(r.p.name.toUpperCase())+'" data-o="'+k+'"></div>'+
      '<div class="flap sc" data-t="'+(r.v==null?"-- ---":fmtInt(r.v))+'" data-o="'+k+'"></div>'+
      '<div class="status">'+st+'</div></div>';
  });
  var played=rows.filter(function(r){ return r.v!=null; });
  if(played.length>1){
    html+='<div class="streakbar"><span class="s">Margin <b class="num">'+
      fmtInt(played[0].v-played[1].v)+'</b></span>'+
      '<span class="s">Day total <b class="num">'+
      fmtInt(played.reduce(function(a,r){return a+r.v;},0))+'</b></span></div>';
  }
  body.innerHTML=html;
  Array.prototype.forEach.call(body.querySelectorAll(".flap"),function(f){
    flapInto(f,f.getAttribute("data-t"),+f.getAttribute("data-o"));
  });
}

function helpIcon(text){

}
var TIP_SWING='<b>Swing %</b> \u2014 how erratic a player is. Assumed formula: sample standard '+
  'deviation of daily scores divided by their average, as a percentage '+
  '(<code>STDEV.S / AVERAGE</code>). This reproduces the sheet\u2019s own figures exactly '+
  '(11.62 / 13.14 / 12.39), so the assumption is confirmed rather than guessed. Lower = steadier.';
var TIP_BIG='<b>40K days</b> \u2014 days with a total above 40,000. The sheet calls this '+
  '\u201c&gt;4000 DAYS\u201d; matching it against the numbers gives 4 / 10 / 7, which is the count of '+
  'days over 40,000 (an average above 8,000 per round), not rounds over 4,000.';
var TIP_ROUND='<b>Best / worst round</b> \u2014 single-round scores out of 10,000. These cannot be '+
  'derived from the sheet, which only records day totals, so they are read from the stats table. '+
  'Note the sheet\u2019s column headers are swapped: the columns labelled \u201cHighest/Lowest Score\u201d '+
  'actually hold round scores, and \u201cHighest/Lowest Round\u201d holds day totals. Values are '+
  'classified by size rather than by label.';

  'scores; matches the sheet\u2019s own rolling row. Form deliberately carries across month '+
  'boundaries, so a monthly view still shows the true seven-day window rather than restarting.';
var TIP_MONTHLY='<b>Monthly totals</b> \u2014 every calendar month found in the data, scored from '+
  'scratch. A month is only counted as won once the next month begins, so the current month shows '+
  'as <b>LIVE</b> and its leader is provisional.';
var TIP_MONTHWINS='<b>Months won</b> \u2014 one point for the highest monthly total in each '+
  '<i>completed</i> month. The month in progress is shown separately and does not count yet. '+
  'Each dot is a finished month; filled dots are the ones that player won.';

    h+='<tr><td class="pos">'+(i+1)+'</td>'+

      '<span class="nm">'+esc(p.name)+'</span></div></td>'+
      '<td class="big num">'+fmtInt(p.total)+'</td>'+
      '<td class="num" style="color:var(--ink);font-weight:600">'+fmtInt(p.avg)+'</td>'+
      '<td class="num">'+p.played+'</td>'+
      '<td class="num" style="color:var(--gold);font-weight:600">'+p.wins+'</td>'+
      '<td class="num">'+fmtInt(p.dayHigh)+'<div class="sub">'+(p.dayHighAt?esc(fmtDate(p.dayHighAt)):"")+'</div></td>'+
      '<td class="num">'+fmtInt(p.dayLow)+'<div class="sub">'+(p.dayLowAt?esc(fmtDate(p.dayLowAt)):"")+'</div></td>'+
      '<td class="num">'+(p.roundHigh!=null?fmtInt(p.roundHigh):"\u2014")+'</td>'+
      '<td class="num">'+(p.roundLow!=null?fmtInt(p.roundLow):"\u2014")+'</td>'+
      '<td class="num">'+p.bigDays+'</td>'+

  });
  h+='</tbody></table></div>';
  if(m.scoped)
    h+='<div class="pnote" style="margin-top:9px">Best/worst round are all-time figures from the '+

  else if(!m.hasRounds)
    h+='<div class="pnote" style="margin-top:9px">No round-level data in this sheet \u2014 '+
       'best/worst round columns show day totals only.</div>';

  Array.prototype.forEach.call(body.querySelectorAll("[data-sort]"),function(b){

  var defs='', scene='', beams='', refl='', labels='';

  top.forEach(function(p,r){
    defs+='<linearGradient id="suit'+r+'" x1="0" y1="0" x2="0" y2="1">'+
        '<stop offset="0" stop-color="'+p.color+'"/>'+
        '<stop offset="1" stop-color="'+p.color+'" stop-opacity=".55"/></linearGradient>'+
      '<linearGradient id="beam'+r+'" x1="0" y1="0" x2="0" y2="1">'+
        '<stop offset="0" stop-color="'+p.color+'" stop-opacity=".22"/>'+
        '<stop offset="1" stop-color="'+p.color+'" stop-opacity="0"/></linearGradient>'+
      '<linearGradient id="face'+r+'" x1="0" y1="0" x2="0" y2="1">'+
        '<stop offset="0" stop-color="#1b2f4c"/><stop offset="1" stop-color="#0a1424"/></linearGradient>'+
      '<linearGradient id="refl'+r+'" x1="0" y1="0" x2="0" y2="1">'+
        '<stop offset="0" stop-color="'+p.color+'" stop-opacity=".18"/>'+
        '<stop offset="1" stop-color="'+p.color+'" stop-opacity="0"/></linearGradient>'+
      '<radialGradient id="pool'+r+'" cx="50%" cy="50%" r="50%">'+
        '<stop offset="0" stop-color="'+p.color+'" stop-opacity=".33"/>'+
        '<stop offset="1" stop-color="'+p.color+'" stop-opacity="0"/></radialGradient>';
  });

  slotRanks.forEach(function(r,slot){
    var p=top[r], x=startX+slot*(pw+gap), cx=x+pw/2;
    var h=hByRank[r], ty=floorY-h, d=9;

    /* spotlight beam from above */
    beams+='<path d="M'+(cx-16)+' 0 L'+(cx+16)+' 0 L'+(cx+52)+' '+ty+' L'+(cx-52)+' '+ty+'Z" '+
      'fill="url(#beam'+r+')"/>';
    /* light pool on the plinth top */
    beams+='<ellipse cx="'+cx+'" cy="'+(ty-4)+'" rx="'+(pw/2+6)+'" ry="9" fill="url(#pool'+r+')"/>';

    /* reflection below the floor */
    refl+='<rect x="'+(x+6)+'" y="'+floorY+'" width="'+(pw-12)+'" height="'+Math.round(h*0.42)+
      '" fill="url(#refl'+r+')"/>';

    /* plinth: front face + receding top face */
    scene+='<g>'+
      '<polygon points="'+x+','+ty+' '+(x+pw)+','+ty+' '+(x+pw-d)+','+(ty-d)+' '+(x+d)+','+(ty-d)+'" '+
        'fill="'+p.color+'" opacity=".34"/>'+
      '<rect x="'+x+'" y="'+ty+'" width="'+pw+'" height="'+h+'" rx="3" fill="url(#face'+r+')" '+
        'stroke="'+p.color+'" stroke-opacity=".45"/>'+
      /* colour band along the top edge */
      '<rect x="'+x+'" y="'+ty+'" width="'+pw+'" height="3.5" fill="'+p.color+'" opacity=".9"/>'+
      /* medal disc */
      '<circle cx="'+(x+20)+'" cy="'+(ty+21)+'" r="11" fill="'+MEDALS[r][1]+'"/>'+
      '<circle cx="'+(x+20)+'" cy="'+(ty+19.5)+'" r="9.5" fill="'+MEDALS[r][0]+'"/>'+
      '<text x="'+(x+20)+'" y="'+(ty+23.5)+'" text-anchor="middle" fill="#2a1c05" '+
        'font-size="12" font-weight="700" style="font-family:var(--font-display)">'+(r+1)+'</text>'+
      /* win count */
      '<text x="'+cx+'" y="'+(ty+h*0.66)+'" text-anchor="middle" fill="'+p.color+'" '+
        'font-size="34" font-weight="700" style="font-family:var(--font-display);'+
        'filter:drop-shadow(0 0 9px '+p.color+'88)">'+p.wins+'</text>'+
      '<text x="'+cx+'" y="'+(ty+h*0.66+13)+'" text-anchor="middle" fill="#8fa5c4" '+
        'font-size="9" letter-spacing="1.6" style="font-family:ui-monospace,monospace">WINS</text>'+
      '</g>';

    /* pilot standing on the plinth top.
       The outer <g> carries the positioning transform as an ATTRIBUTE and must
       never be given a CSS animation: a CSS transform overrides the attribute,
       so animating this element would snap the pilot to the SVG origin. The
       entrance animation therefore lives on an inner <g>, which has no
       transform attribute of its own. */
    var sc=0.62, px=cx-30*sc, py=(ty-d+2)-94*sc;
    scene+='<g transform="translate('+px.toFixed(1)+','+py.toFixed(1)+') scale('+sc+')">'+
      '<g class="pilot-enter" style="animation-delay:'+(slot*0.09)+'s">'+
      pilotArt(p.color,r)+'</g></g>';

    /* name + share of days, below the floor */
    labels+='<text x="'+cx+'" y="'+(floorY+22)+'" text-anchor="middle" fill="#e9f2ff" '+
      'font-size="15" font-weight="700" letter-spacing="1" '+
      'style="font-family:var(--font-display);text-transform:uppercase">'+esc(p.name)+'</text>'+
      '<text x="'+cx+'" y="'+(floorY+38)+'" text-anchor="middle" fill="#6a839f" '+
      'font-size="10.5" letter-spacing="1" style="font-family:ui-monospace,monospace">'+
      (contested?Math.round(p.wins/contested*100):0)+'% OF DAYS</text>';
  });

  var svg='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Podium of daily wins">'+
    '<defs>'+defs+
      '<linearGradient id="floorline" x1="0" y1="0" x2="1" y2="0">'+
        '<stop offset="0" stop-color="#7ea8d8" stop-opacity="0"/>'+
        '<stop offset=".5" stop-color="#7ea8d8" stop-opacity=".55"/>'+
        '<stop offset="1" stop-color="#7ea8d8" stop-opacity="0"/></linearGradient>'+
    '</defs>'+
    beams+refl+
    '<rect x="20" y="'+floorY+'" width="'+(W-40)+'" height="1.4" fill="url(#floorline)"/>'+
    scene+labels+'</svg>';

  /* footer chips */
  var best=Math.max.apply(null,m.players.map(function(p){ return p.longest; }));
  var holders=m.players.filter(function(p){ return p.longest===best && best>0; });
  var chips='<div class="streakbar">';
  var streaking=m.players.filter(function(p){ return p.streak>0; });
  if(streaking.length) streaking.forEach(function(p){
    chips+='<span class="s" style="border-color:'+p.color+'55">\uD83D\uDD25 <b>'+esc(p.name)+
      '</b> on a <b class="num">'+p.streak+'</b>-day streak</span>';
  });
  else chips+='<span class="s">No active streak</span>';
  chips+='<span class="s"><b class="num">'+contested+'</b> day'+(contested===1?"":"s")+' contested</span>';
  chips+='<span class="s"'+(holders.length===1?' style="border-color:'+holders[0].color+'55"':'')+'>'+
    'Longest streak '+(holders.length?'<b>'+holders.map(function(p){return esc(p.name);}).join(" & ")+
    '</b> <b class="num">'+best+'</b> day'+(best===1?"":"s"):'<b>\u2014</b>')+'</span>';
  chips+='</div>';

  body.innerHTML=scopeNote(m)+'<div class="podium-scene">'+svg+'</div>'+chips;
}

   11b. PERIOD SELECTOR
   Scopes the race, standings, history, form and day-wins panels to either the
   whole contest or a single calendar month.

function renderPeriodBar(){
  var bar=document.getElementById("periodbar");
  if(!bar||!STATE.model) return;
  var months=listMonths(STATE.model);
  var opts=[{k:"all",label:"All time"}].concat(months.map(function(k){
    return {k:k,label:monthLabel(k)};
  }));
  if(opts.map(function(o){return o.k;}).indexOf(STATE.period)<0) STATE.period="all";

  bar.innerHTML='<span class="plabel">Race</span>'+
    '<div class="pchips">'+opts.map(function(o){
      var live=(o.k!=="all"&&o.k===months[months.length-1]);
      return '<button class="pchip'+(STATE.period===o.k?" on":"")+'" data-p="'+esc(o.k)+'">'+
        esc(o.label)+(live?'<span class="livetag">LIVE</span>':'')+'</button>';
    }).join("")+'</div>'+
    '<span class="phint">Scopes the ocean race, standings, history, form &amp; day wins. '+
    'Monthly panels always show every month.</span>';

  Array.prototype.forEach.call(bar.querySelectorAll(".pchip"),function(b){
    b.addEventListener("click",function(){
      STATE.period=b.getAttribute("data-p");
      rescope();
      renderPeriodBar();
      Store.set("tg-period",STATE.period);
    });
  });
}

/* ============================================================================
   11c. PANEL: MONTHLY RACE  (compare every month side by side)
   ========================================================================== */
function renderMonthly(body){
  var m=STATE.model, months=monthlySummary(m);
  if(!months.length){ body.innerHTML='<div class="empty">No dated scores yet.</div>'; return; }

  var groups=months.map(function(mo){
    return { label:mo.short, sub:mo.days+"d"+(mo.inProgress?" \u00B7 LIVE":"") };
  });
  var series=m.players.filter(function(p){ return !STATE.hidden[p.key]; }).map(function(p){
    return { name:p.name, color:p.color,
      values:months.map(function(mo){
        var r=mo.rows.filter(function(x){ return x.key===p.key; })[0];
        return r?r.total:null;
      }) };
  });

  var h='<div class="pnote" style="margin-bottom:9px">MONTHLY TOTALS \u00B7 '+months.length+
    ' month'+(months.length===1?"":"s")+' '+helpIcon(TIP_MONTHLY)+'</div>'+
    legendHTML()+'<div class="chart-wrap" id="mchart"></div>';

  /* month-by-month table */
  h+='<div style="overflow-x:auto;margin-top:11px"><table><thead><tr><th>Month</th><th>Days</th>'+
    m.players.map(function(p){ return '<th>'+esc(p.name)+'</th>'; }).join("")+
    '<th>Champion</th></tr></thead><tbody>';
  months.slice().reverse().forEach(function(mo){
    var best=0; mo.rows.forEach(function(r){ if(r.total>best) best=r.total; });
    h+='<tr><td><span class="mname">'+esc(mo.label)+'</span>'+
      (mo.inProgress?'<span class="livetag sm">LIVE</span>':'')+'</td>'+
      '<td class="num">'+mo.days+'</td>';
    m.players.forEach(function(p){
      var r=mo.rows.filter(function(x){ return x.key===p.key; })[0];
      var lead=r&&r.total===best&&best>0;
      h+='<td class="num"'+(lead?' style="color:'+p.color+';font-weight:700"':'')+'>'+
        (r&&r.total?fmtInt(r.total):"\u2014")+'</td>';
    });
    var champ=mo.champs.map(function(k){
      var p=m.players.filter(function(x){ return x.key===k; })[0];
      return p?'<span style="color:'+p.color+';font-weight:700">'+esc(p.name)+'</span>':k;
    }).join(" &amp; ");
    h+='<td>'+(champ||"\u2014")+(mo.inProgress?'<div class="sub">leading</div>':'')+'</td></tr>';
  });
  h+='</tbody></table></div>';
  body.innerHTML=h;

  groupedBarChart(document.getElementById("mchart"),{
    groups:groups, series:series, height:236, aria:"Monthly totals per player"
  });
  wireLegend(body,function(){ renderMonthly(body); });
}

/* ============================================================================
   11d. PANEL: MONTHLY WINS  (champions board)
   ========================================================================== */
function renderMonthWins(body){
  var m=STATE.model, months=monthlySummary(m);
  var won=monthsWonMap(months);
  var done=months.filter(function(mo){ return !mo.inProgress; });
  var live=months.filter(function(mo){ return mo.inProgress; })[0];

  var rows=m.players.map(function(p){
    return { p:p, n:won[p.key]||0 };
  }).sort(function(a,b){ return b.n-a.n; });
  var max=Math.max.apply(null,rows.map(function(r){ return r.n; }))||1;

  var h='<div class="pnote" style="margin-bottom:10px">MONTHS WON \u00B7 '+done.length+
    ' completed '+helpIcon(TIP_MONTHWINS)+'</div>';

  if(!done.length){
    h+='<div class="empty" style="margin-bottom:11px">No month has finished yet.<br>'+
       'The first champion is crowned when a new month begins.</div>';
  }

  h+='<div class="champs">'+rows.map(function(r){
    var pips="";
    done.forEach(function(mo){
      var hit=mo.champs.indexOf(r.p.key)>-1;
      pips+='<span class="pip'+(hit?" on":"")+'" style="'+(hit?"background:"+r.p.color:"")+
        '" title="'+esc(mo.label)+'"></span>';
    });
    return '<div class="champrow" style="color:'+r.p.color+'">'+
      '<div class="cbadge">'+r.p.badge+'</div>'+
      '<div class="cmid"><div class="cname">'+esc(r.p.name)+'</div>'+
        '<div class="cbar"><span style="width:'+Math.round(r.n/max*100)+'%"></span></div>'+
        '<div class="pips">'+pips+'</div></div>'+
      '<div class="ccount num">'+r.n+'</div></div>';
  }).join("")+'</div>';

  if(live){
    var best=0; live.rows.forEach(function(x){ if(x.total>best) best=x.total; });
    var leaders=live.rows.filter(function(x){ return x.total===best&&best>0; });
    var second=live.rows.slice().sort(function(a,b){ return b.total-a.total; })[1];
    h+='<div class="livebox">'+
      '<div class="lbhead">'+esc(live.label)+' \u00B7 in progress<span class="livetag">LIVE</span></div>'+
      (leaders.length
        ? '<div class="lbmain">'+leaders.map(function(x){
            return '<span style="color:'+x.color+'">'+esc(x.name)+'</span>'; }).join(" &amp; ")+
          '<span class="lbsub"> leads with </span><b class="num">'+fmtInt(best)+'</b>'+
          (second&&second.total?'<span class="lbsub"> \u00B7 margin </span><b class="num">'+
            fmtInt(best-second.total)+'</b>':'')+'</div>'
        : '<div class="lbmain"><span class="lbsub">No scores logged yet this month.</span></div>')+
      '<div class="sub" style="margin-top:5px">'+live.days+' day'+(live.days===1?"":"s")+
      ' played \u00B7 counts once the month closes</div></div>';
  }
  body.innerHTML=h;
}
